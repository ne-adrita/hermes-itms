[pytest]
# Test discovery configuration for the Hermes / ITMS repository.
#
# `benchmarks/data/tasks/*/official_test.py` matches pytest's default
# `*_test.py` collection pattern. Those files are *benchmark data* (official
# HumanEval checks for the Phase 0 task set), not test modules, and collecting
# them both fails and risks executing them in the wrong context. They are
# therefore excluded from collection.
#
# The list below is explicit so that a root-level `pytest` run collects every
# real test module in the repository.
testpaths =
    test_itms.py
    test_milestones_2_3.py
    test_openrouter.py
    test_surgical_splicer.py
    test_benchmark_safety.py
    test_tdsc.py
    test_completed_benchmark_dashboard.py
    benchmarks/phase0/test_phase0_tasks.py
    benchmarks/tests
    experiments/itms_aider_cline_v1/tests

norecursedirs =
    .venv
    .git
    __pycache__
    .pytest_cache
    benchmarks/data
    results
    pilot_runs
    experiments/itms_aider_cline_v1/runs
    scratch
    tmp
    temp

python_files = test_*.py
